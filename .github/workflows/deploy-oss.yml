name: Deploy portfolio to Alibaba Cloud OSS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oss-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OSS_ENDPOINT: oss-cn-guangzhou.aliyuncs.com
      OSS_BUCKET: photography3

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --dir portfolio-site --frozen-lockfile --prefer-offline

      - name: Build site
        run: pnpm --dir portfolio-site build

      - name: Install official ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh \
            -o /tmp/install-ossutil.sh
          sudo bash /tmp/install-ossutil.sh

      - name: Configure ossutil
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          test -n "$OSS_ENDPOINT"
          test -n "$OSS_ACCESS_KEY_ID"
          test -n "$OSS_ACCESS_KEY_SECRET"
          test -n "$OSS_BUCKET"
          ossutil config \
            -e "$OSS_ENDPOINT" \
            -i "$OSS_ACCESS_KEY_ID" \
            -k "$OSS_ACCESS_KEY_SECRET" \
            -L CH

      - name: Sync static site to OSS
        run: |
          ossutil sync portfolio-site/dist/client/ "oss://$OSS_BUCKET/" \
            --force \
            --cache-control "public,max-age=2592000" \
            --disable-ignore-error

          # Migrate existing assets that were uploaded before cache metadata was configured.
          ossutil set-props "oss://$OSS_BUCKET/assets/" \
            -r \
            -f \
            --cache-control "public,max-age=2592000"

          # These fixed-name assets are versioned in their request URLs.
          for versioned_prefix in \
            photography \
            photography-thumbnails \
            projects \
            projects-mobile \
            project-thumbnails
          do
            ossutil set-props "oss://$OSS_BUCKET/assets/$versioned_prefix/" \
              -r \
              -f \
              --cache-control "public,max-age=31536000,immutable"
          done

          # Vite's hashed JS/CSS filenames are immutable between deployments.
          find portfolio-site/dist/client/assets \
            -maxdepth 1 \
            -type f \
            \( -name '*.js' -o -name '*.css' \) \
            -print0 | while IFS= read -r -d '' asset_file
          do
            object_path="${asset_file#portfolio-site/dist/client/}"
            ossutil set-props "oss://$OSS_BUCKET/$object_path" \
              -f \
              --cache-control "public,max-age=31536000,immutable"
          done

          ossutil set-props "oss://$OSS_BUCKET/favicon.png" \
            -f \
            --cache-control "public,max-age=31536000,immutable"

          # Keep the HTML entry fresh so each release can point to new hashed assets.
          ossutil cp portfolio-site/dist/client/index.html \
            "oss://$OSS_BUCKET/index.html" \
            -f \
            --cache-control "public,max-age=60,must-revalidate"
