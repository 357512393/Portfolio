name: Deploy portfolio to Tencent COS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cos-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      COS_BUCKET: kunh-1316138679
      COS_REGION: ap-hongkong

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: portfolio-site/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --dir portfolio-site --frozen-lockfile --prefer-offline

      - name: Build site
        run: pnpm --dir portfolio-site build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install COS command-line tool
        run: python -m pip install --disable-pip-version-check coscmd

      - name: Configure COS command-line tool
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          test -n "$TENCENT_SECRET_ID"
          test -n "$TENCENT_SECRET_KEY"
          coscmd config \
            -a "$TENCENT_SECRET_ID" \
            -s "$TENCENT_SECRET_KEY" \
            -b "$COS_BUCKET" \
            -r "$COS_REGION"

      - name: Upload static site to COS
        run: coscmd upload -r portfolio-site/dist/client/ /
